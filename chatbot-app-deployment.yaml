apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-app
  labels:
    app: chatbot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chatbot-app
  template:
    metadata:
      labels:
        app: chatbot-app
    spec:
      containers:
        - name: chatbot
          image: marlyt/chatbot-app:v1
          ports:
            - containerPort: 8501
          env:
            - name: LLM_URL
              value: "http://llm-service:11434/v1"
            - name: LLM_MODEL
              value: "smollm2"